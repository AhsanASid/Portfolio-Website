      <stop offset="0%" stop-color="#0D0F11"/>
      <stop offset="100%" stop-color="#15181C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22272E" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#22272E" stroke-width="2"/>

