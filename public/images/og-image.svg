  <text x="70" y="210" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="700" fill="#F3F4F6" letter-spacing="-1">Ahsan Ahmad Siddiqui</text>
  <text x="70" y="275" font-family="-apple-system, sans-serif" font-size="28" font-weight="500" fill="#F97316">Software Engineer @ Mobily Infotech</text>
