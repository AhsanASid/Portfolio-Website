  <text x="96" y="82" font-family="monospace" font-size="14" fill="#94A3B8" letter-spacing="2">OPERATIONAL · SYSTEMS &amp; INFRASTRUCTURE</text>
  <text x="1090" y="82" font-family="monospace" font-size="14" fill="#64748B" text-anchor="end">BENGALURU, IN</text>

  <line x1="70" y1="110" x2="1130" y2="110" stroke="#22272E" stroke-width="1"/>

