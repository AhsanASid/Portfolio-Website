    <text x="24" y="45" font-family="monospace" font-size="34" font-weight="700" fill="#F3F4F6">50+ Hours</text>
    <text x="24" y="80" font-family="-apple-system, sans-serif" font-size="15" fill="#94A3B8">Monthly Toil Eliminated</text>

    <!-- Box 2 -->
    <rect x="330" y="0" width="310" height="110" rx="10" fill="#181B20" stroke="#262D36" stroke-width="1"/>
    <text x="354" y="45" font-family="monospace" font-size="34" font-weight="700" fill="#F3F4F6">17s Recovery</text>
    <text x="354" y="80" font-family="-apple-system, sans-serif" font-size="15" fill="#94A3B8">Velero Disaster Recovery</text>

    <!-- Box 3 -->
